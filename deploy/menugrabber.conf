# ============================================================
# MenuGrabber — Apache configuration for http://rprnt.com/menugrabber
#
# The site is fully static (HTML/CSS/JS + a single data/menu.json that the
# daily cron job regenerates). Nothing dynamic runs in Apache.
#
# Because the docroot is a *git clone* (the repo root is the web root), this
# config also hides .git and the non-web project files from the web.
#
# HOW TO INSTALL (pick ONE of the two cases below), then reload Apache:
#   sudo cp deploy/menugrabber.conf /etc/apache2/conf-available/menugrabber.conf
#   sudo a2enconf menugrabber        # Debian/Ubuntu
#   sudo systemctl reload apache2    # or: sudo apachectl -k graceful
# (On RHEL/CentOS, drop the file in /etc/httpd/conf.d/ and reload httpd.)
# ============================================================

# --- Serve the correct content type for the data file ---
AddType application/json .json

<Directory /var/www/rprnt/menugrabber>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.html

    # Always fetch a fresh menu.json; cache the static shell briefly.
    <IfModule mod_headers.c>
        <FilesMatch "\.json$">
            Header set Cache-Control "no-cache, must-revalidate"
        </FilesMatch>
    </IfModule>
</Directory>

# --- Keep the git clone's internals & source files off the web ---
<DirectoryMatch "/var/www/rprnt/menugrabber/(\.git|scraper|deploy|screenshots)">
    Require all denied
</DirectoryMatch>
<FilesMatch "\.(sh|md|sample\.json)$">
    Require all denied
</FilesMatch>

# ------------------------------------------------------------
# CASE A — /var/www/rprnt IS the rprnt.com DocumentRoot (most likely).
#   Then /menugrabber is just a subfolder and the <Directory> block above
#   is all you need. Leave the Alias below commented out.
#
# CASE B — rprnt.com's DocumentRoot is somewhere ELSE.
#   Uncomment this Alias so the URL path maps to the folder on disk:
#
# Alias /menugrabber /var/www/rprnt/menugrabber
# ------------------------------------------------------------
