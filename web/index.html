<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ff8a5c" />
  <title>What's for Lunch? 🍽️</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="sky">
    <span class="cloud cloud-1">🍎</span>
    <span class="cloud cloud-2">🥕</span>
    <span class="cloud cloud-3">🥛</span>
    <span class="cloud cloud-4">🍪</span>
  </div>

  <main class="app" id="app">
    <header class="topbar">
      <h1 class="title">What's for Lunch? <span class="title-emoji" aria-hidden="true">🍽️</span></h1>
      <p class="school" id="school">Westfield Elementary</p>
    </header>

    <!-- Day banner -->
    <section class="daybar" aria-live="polite">
      <p class="day-label" id="dayLabel">Today</p>
      <p class="day-date" id="dayDate">—</p>
    </section>

    <!-- Menu content (filled by app.js) -->
    <section id="menu" class="menu" aria-live="polite">
      <div class="loading">Loading today's menu… 🍕</div>
    </section>

    <!-- Navigation -->
    <nav class="nav" aria-label="Change day">
      <!-- Big, obvious jump straight to tomorrow's lunch -->
      <button class="btn btn-tomorrow btn-primary" id="tomorrowBtn" type="button">☀️ See Tomorrow's Menu</button>
      <!-- Stepper row for browsing any day -->
      <div class="nav-row">
        <button class="btn btn-step" id="prevBtn" type="button">◀ Day Before</button>
        <button class="btn btn-today" id="todayBtn" type="button">★ Today</button>
        <button class="btn btn-step" id="nextBtn" type="button">Next Day ▶</button>
      </div>
    </nav>

    <footer class="footer">
      <span class="updated" id="updated">—</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
